<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker Welcome</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: #00ff66;
  font-family: sans-serif;
  text-align: center;
}

#intro {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

video {
  width: 100%;
  max-height: 85vh;
  object-fit: contain;
}

#enter {
  display: none;
  padding: 15px 45px;
  margin: 20px;
  background: #00ff66;
  color: black;
  border: none;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="intro">

  <video id="myVideo" autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <button id="enter" onclick="goHome()">
    ENTER
  </button>

</div>

<script>
const video = document.getElementById("myVideo");
const enter = document.getElementById("enter");

video.addEventListener("ended", function() {
  enter.style.display = "block";
});

function goHome() {
  window.location.href = "home.html";
}
</script>

</body>
</html>
